<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArkForge</title>
<style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#1f1f1f;color:#ccc}#boot{padding:24px;font:14px sans-serif}</style>
<link rel="stylesheet" href="./out/vs/workbench/workbench.web.main.internal.css">
</head><body><div id="boot">正在启动 ArkForge 工作台…</div>
<script>
globalThis._VSCODE_FILE_ROOT = new URL('./out/',location.href).href;
globalThis._VSCODE_CSS_LOAD = () => {};
const pending = new Map(); let sequence = Math.floor(Math.random()*1000000000);
window.nativeReplyChunk = function(id,part,last) {
  const item=pending.get(id);if(!item)return;
  (item.chunks??=[]).push(part);
  if(last)window.nativeReply(id,item.chunks.join(''),'');
};
window.nativeReply = function(id,result,error) {
  const item=pending.get(id); if(!item)return;
  pending.delete(id); clearTimeout(item.timer);
  error ? item.reject(new Error(error)) : item.resolve(result);
};
window.nativeCall = (method,args={}) => new Promise((resolve,reject)=>{
  const id=++sequence;
  const timer=setTimeout(()=>{pending.delete(id);reject(new Error('本机服务等待超时：'+method));},600000);
  pending.set(id,{resolve,reject,timer});
  try { window.arkforgeNative.request(id,method,JSON.stringify(args)); }
  catch(e) {clearTimeout(timer);pending.delete(id);reject(e);}
});
addEventListener('error',e=>{console.error('[ArkForgeWorkbench]',e.message);});
addEventListener('unhandledrejection',e=>console.error('[ArkForgeWorkbench]',e.reason?.stack||String(e.reason))); 
</script>
<script type="module">
try {
  await import('./out/nls.messages.js');
  const code = await import('./out/vs/workbench/workbench.web.main.internal.js');
  const project=JSON.parse(await window.nativeCall('workspace_info'));
  let identity=2166136261;
  for(const c of project.root)identity=Math.imul(identity^c.charCodeAt(0),16777619);
  const folderUri=code.URI.parse('arkforge://p-'+(identity>>>0).toString(16)+'/workspace');
  const manifest = await (await fetch('./extensions.json')).json();
  const extensions = manifest.map(path => code.URI.parse(new URL(path,location.href).href));
  code.create(document.body,{
    workspaceProvider:{workspace:{folderUri,label:project.name},trusted:true,open:async()=>false},
    additionalBuiltinExtensions:extensions,
    webviewEndpoint:'http://{{uuid}}.localhost:18712/out/vs/workbench/contrib/webview/browser/pre',
    productConfiguration:{nameShort:'ArkForge',nameLong:'ArkForge',applicationName:'arkforge',enableTelemetry:false,extensionEnabledApiProposals:{'arkforge.arkforge-device':['defaultChatParticipant','chatProvider','fileSearchProvider','textSearchProvider']}},
    configurationDefaults:{
      'workbench.colorTheme':'Default Dark Modern','workbench.startupEditor':'none',
      'workbench.activityBar.location':'default','window.menuBarVisibility':'visible',
      'window.commandCenter':true,'window.titleBarStyle':'custom','window.title':'${folderName} — ArkForge',
      'security.workspace.trust.enabled':false,'telemetry.telemetryLevel':'off',
      'editor.fontSize':15,'editor.minimap.enabled':false,
      'terminal.integrated.defaultProfile.linux':'ArkForge 终端',
      'terminal.integrated.defaultProfile.windows':'ArkForge 终端',
      'terminal.integrated.defaultProfile.osx':'ArkForge 终端',
      'files.associations':{'*.ets':'typescript','*.json5':'jsonc'},
      'files.exclude':{'**/.arkforge':true,'**/.hvigor':true,'**/.cxx':true},
      'extensions.autoCheckUpdates':false,'extensions.autoUpdate':false
    },
    commands:[{id:'arkforge.native',handler:(method,args)=>window.nativeCall(method,{...args,workspaceRoot:project.root})}]
  });
  document.getElementById('boot')?.remove();
  window.arkforgeBuildEvent = text => code.commands.executeCommand('arkforge.appendBuildLog',text);
} catch(e) {
  document.getElementById('boot').textContent='工作台启动失败：'+e.message;
  console.error('[ArkForgeWorkbench]',e.stack||String(e));
}
</script></body></html>
