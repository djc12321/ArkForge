checker:
  class_definitions:
  - extends: public Type
    name: UndefinedType
    public:
      constructors:
      - args: []
        name: UndefinedType
        other_initializers:
        - class_field: Type
          init_value: TypeFlag::UNDEFINED
        raw_declaration: UndefinedType()
      methods:
      - args:
        - name: ss
          type:
            name: stringstream
            namespace: std
            ref_depth: 1
        - name: precise
          type:
            name: bool
            prefix: '[[maybe_unused]]'
        name: ToString
        postfix: const override
        raw_declaration: void ToString(std::stringstream &ss, [[maybe_unused]] bool
          precise) const override
        return_type:
          name: void
      - args:
        - name: relation
          type:
            name: TypeRelation
            ptr_depth: 1
        - name: other
          type:
            name: Type
            ptr_depth: 1
        name: Identical
        postfix: override
        raw_declaration: void Identical(TypeRelation *relation, Type *other) override
        return_type:
          name: void
      - args:
        - name: relation
          type:
            name: TypeRelation
            ptr_depth: 1
        - name: target
          type:
            name: Type
            ptr_depth: 1
        name: AssignmentSource
        postfix: override
        raw_declaration: bool AssignmentSource(TypeRelation *relation, Type *target)
          override
        return_type:
          name: bool
      - args:
        - name: relation
          type:
            name: TypeRelation
            ptr_depth: 1
        - name: source
          type:
            name: Type
            ptr_depth: 1
        name: AssignmentTarget
        postfix: override
        raw_declaration: void AssignmentTarget(TypeRelation *relation, Type *source)
          override
        return_type:
          name: void
      - args: []
        name: GetTypeFacts
        postfix: const override
        raw_declaration: TypeFacts GetTypeFacts() const override
        return_type:
          name: TypeFacts
      - args:
        - name: allocator
          type:
            name: ArenaAllocator
            ptr_depth: 1
        - name: relation
          type:
            name: TypeRelation
            ptr_depth: 1
        - name: globalTypes
          type:
            name: GlobalTypesHolder
            ptr_depth: 1
        name: Instantiate
        postfix: override
        raw_declaration: Type *Instantiate(ArenaAllocator *allocator, TypeRelation
          *relation, GlobalTypesHolder *globalTypes) override
        return_type:
          name: Type
          ptr_depth: 1
include:
- '"checker/types/type.h"'
macros:
- name: ES2PANDA_COMPILER_CHECKER_TYPES_TS_UNDEFINED_TYPE_H
