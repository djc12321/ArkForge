    - NO_COPY_SEMANTIC(FunctionSignature);
    - DEFAULT_MOVE_SEMANTIC(FunctionSignature);
    name: FunctionSignature
    private: {}
    public:
      constructors:
      - args:
        - initializer_for: typeParams_
          name: typeParams
          type:
            name: TSTypeParameterDeclaration
            ptr_depth: 1
        - name: params
