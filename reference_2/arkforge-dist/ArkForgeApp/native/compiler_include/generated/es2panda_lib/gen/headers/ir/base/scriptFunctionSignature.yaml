                ptr_depth: 1
        - initializer_for: returnTypeAnnotation_
          name: returnTypeAnnotation
          type:
            name: TypeNode
            ptr_depth: 1
        - default_value: 'false'
          initializer_for: hasReceiver_
          name: hasReceiver
          type:
            name: bool
        name: FunctionSignature
        other_initializers:
        - class_field: params_
          init_value: std::move(params)
        raw_declaration: "explicit FunctionSignature(TSTypeParameterDeclaration *typeParams,\
          \ ArenaVector<ir::Expression *> &&params,\n                            \
          \   TypeNode *returnTypeAnnotation, bool hasReceiver = false)"
        return_type:
          prefix: explicit
      - args: []
        name: FunctionSignature
        postfix: = delete
        raw_declaration: FunctionSignature() = delete
      destructors:
      - args: []
        name: ~FunctionSignature
        postfix: = default
        raw_declaration: ~FunctionSignature() = default
      methods:
      - additional_attributes: get
        args: []
        name: Params
        postfix: const noexcept
        raw_declaration: '[[nodiscard]] const ArenaVector<ir::Expression *> &Params()
          const noexcept'
        return_type:
          name: ArenaVector
          prefix: '[[nodiscard]] const'
          ref_depth: 1
          template_args:
          - type:
              name: Expression
              namespace: ir
              ptr_depth: 1
      - additional_attributes: get
        args: []
        name: Params
        postfix: noexcept
        raw_declaration: '[[nodiscard]] ArenaVector<ir::Expression *> &Params() noexcept'
        return_type:
          name: ArenaVector
          prefix: '[[nodiscard]]'
          ref_depth: 1
          template_args:
          - type:
              name: Expression
              namespace: ir
              ptr_depth: 1
      - additional_attributes: get
        args: []
        name: TypeParams
        postfix: noexcept
        raw_declaration: '[[nodiscard]] TSTypeParameterDeclaration *TypeParams() noexcept'
        return_type:
          name: TSTypeParameterDeclaration
          prefix: '[[nodiscard]]'
          ptr_depth: 1
      - additional_attributes: get
        args: []
        name: TypeParams
        postfix: const noexcept
        raw_declaration: '[[nodiscard]] const TSTypeParameterDeclaration *TypeParams()
          const noexcept'
        return_type:
          name: TSTypeParameterDeclaration
          prefix: '[[nodiscard]] const'
          ptr_depth: 1
