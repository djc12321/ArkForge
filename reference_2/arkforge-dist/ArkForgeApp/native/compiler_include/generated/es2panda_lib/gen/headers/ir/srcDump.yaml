          type:
            name: double
        name: Add
        raw_declaration: void Add(double d)
        return_type:
          name: void
      - args: []
        name: Str
        postfix: const
        raw_declaration: std::string Str() const
        return_type:
          name: string
          namespace: std
      - args: []
        name: IncrIndent
        raw_declaration: void IncrIndent()
        return_type:
          name: void
      - args: []
        name: DecrIndent
        raw_declaration: void DecrIndent()
        return_type:
          name: void
      - args:
