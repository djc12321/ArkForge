          type:
            name: string_view
            namespace: std
        name: Add
        raw_declaration: void Add(std::string_view str)
        return_type:
          name: void
      - additional_attributes: set
        args:
        - name: ch
          type:
            name: char
        name: Add
        raw_declaration: void Add(char ch)
        return_type:
          name: void
      - additional_attributes: set
        args:
        - name: i
          type:
            name: int8_t
        name: Add
        raw_declaration: void Add(int8_t i)
        return_type:
          name: void
      - additional_attributes: set
        args:
        - name: i
          type:
            name: int16_t
        name: Add
        raw_declaration: void Add(int16_t i)
        return_type:
          name: void
      - additional_attributes: set
        args:
