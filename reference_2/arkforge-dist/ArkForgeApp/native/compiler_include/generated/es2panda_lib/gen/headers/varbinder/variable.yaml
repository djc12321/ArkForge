          prefix: '[[nodiscard]]'
      - args: []
        name: Name
        postfix: const
        raw_declaration: '[[nodiscard]] const util::StringView &Name() const'
        return_type:
          name: StringView
          namespace: util
          prefix: '[[nodiscard]] const'
          ref_depth: 1
      - additional_attributes: set
        args:
        - name: scope
          type:
            name: Scope
            ptr_depth: 1
        name: SetLexical
        postfix: = 0
        raw_declaration: virtual void SetLexical(Scope *scope) = 0
        return_type:
          name: void
          prefix: virtual
