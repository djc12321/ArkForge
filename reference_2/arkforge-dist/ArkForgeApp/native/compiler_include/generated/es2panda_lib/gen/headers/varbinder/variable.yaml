      - args:
        - name: decl
          type:
            name: Decl
            ptr_depth: 1
        - default_value: 'false'
          initializer_for: backReference_
          name: backReference
          type:
            name: bool
        name: EnumVariable
        other_initializers:
        - class_field: Variable
          init_value: decl, VariableFlags::NONE
        raw_declaration: explicit EnumVariable(Decl *decl, bool backReference = false)
        return_type:
          prefix: explicit
      methods:
      - additional_attributes: get
        args: []
        name: Type
        postfix: const override
        raw_declaration: VariableType Type() const override
        return_type:
          name: VariableType
