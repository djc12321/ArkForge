        return_type:
          name: ImportBindingInfo
          prefix: '[[nodiscard]] const'
          ptr_depth: 1
      - additional_attributes: get
        args: []
        name: ImportBinding
        postfix: noexcept
        raw_declaration: '[[nodiscard]] ImportBindingInfo *ImportBinding() noexcept'
        return_type:
          name: ImportBindingInfo
          prefix: '[[nodiscard]]'
          ptr_depth: 1
