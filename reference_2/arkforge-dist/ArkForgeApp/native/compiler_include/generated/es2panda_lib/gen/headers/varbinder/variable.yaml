            ptr_depth: 1
        name: SetTsType
        postfix: noexcept
        raw_declaration: checker::Type *SetTsType(checker::Type *tsType) noexcept
        return_type:
          name: Type
          namespace: checker
          ptr_depth: 1
      - additional_attributes: set
        args:
        - name: scope
          type:
            name: Scope
            namespace: varbinder
            ptr_depth: 1
        name: SetScope
        postfix: noexcept
        raw_declaration: void SetScope(varbinder::Scope *scope) noexcept
        return_type:
          name: void
      - additional_attributes: set
        args:
        - name: flag
          type:
            name: VariableFlags
        name: AddFlag
        postfix: noexcept
        raw_declaration: void AddFlag(VariableFlags flag) noexcept
        return_type:
          name: void
      - additional_attributes: get
        args:
        - name: flag
          type:
            name: VariableFlags
        name: HasFlag
        postfix: const noexcept
        raw_declaration: '[[nodiscard]] bool HasFlag(VariableFlags flag) const noexcept'
        return_type:
          name: bool
          prefix: '[[nodiscard]]'
