checker:
  class_forward_declaration:
  - Type
  functions:
  - args:
    - name: tp
      type:
        name: Type
        other_modifiers: const
        ptr_depth: 1
    name: IsTypeError
    raw_declaration: bool IsTypeError(Type const *tp)
    return_type:
      name: bool
  - args:
    - name: type
      type:
        name: Type
        other_modifiers: const
        ptr_depth: 1
    name: ContainsTypeError
    raw_declaration: bool ContainsTypeError(Type const *type)
    return_type:
      name: bool
include:
- '"varbinder/enumMemberResult.h"'
- '"varbinder/variableFlags.h"'
- '"ir/irnode.h"'
ir:
  class_forward_declaration:
  - AstNode
  - ETSImportDeclaration
macros:
- name: ES2PANDA_COMPILER_SCOPES_VARIABLE_H
varbinder:
  class_definitions:
  - known_macroses:
    - NO_COPY_SEMANTIC(Variable);
    - NO_MOVE_SEMANTIC(Variable);
    - VARIABLE_TYPES(DECLARE_CHECKS_CASTS)
    macros:
    - arguments: variableType, className
      name: DECLARE_CHECKS_CASTS
    name: Variable
    private: {}
    protected: {}
    public:
      destructors:
      - args: []
        name: ~Variable
        postfix: = default
        raw_declaration: virtual ~Variable() = default
        return_type:
          prefix: virtual
      methods:
      - args: []
        name: Type
        postfix: const = 0
        raw_declaration: VariableType virtual Type() const = 0
        return_type:
          name: VariableType
          other_modifiers: virtual
          postfix: virtual
      - additional_attributes: get
        args: []
        name: Declaration
        postfix: const noexcept
        raw_declaration: '[[nodiscard]] const Decl *Declaration() const noexcept'
        return_type:
          name: Decl
          prefix: '[[nodiscard]] const'
          ptr_depth: 1
      - additional_attributes: get
        args: []
        name: Declaration
        postfix: noexcept
        raw_declaration: '[[nodiscard]] Decl *Declaration() noexcept'
        return_type:
