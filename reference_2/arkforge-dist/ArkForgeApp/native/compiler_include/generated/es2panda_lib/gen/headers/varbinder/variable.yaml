        postfix: const noexcept
        raw_declaration: '[[nodiscard]] bool IsNonNamespaceImportBinding() const noexcept'
        return_type:
          name: bool
          prefix: '[[nodiscard]]'
      - additional_attributes: set
        args:
        - name: scope
          type:
            name: Scope
            prefix: '[[maybe_unused]]'
            ptr_depth: 1
        name: SetLexical
        postfix: override
        raw_declaration: void SetLexical([[maybe_unused]] Scope *scope) override
        return_type:
          name: void
      - args:
        - name: allocator
          type:
            name: ArenaAllocator
            ptr_depth: 1
        - name: decl
          type:
            name: Decl
            ptr_depth: 1
        name: Copy
        postfix: const
        raw_declaration: LocalVariable *Copy(ArenaAllocator *allocator, Decl *decl)
          const
        return_type:
          name: LocalVariable
          ptr_depth: 1
  - extends: public Variable
    name: GlobalVariable
    public:
      constructors:
      - args:
        - name: decl
          type:
            name: Decl
            ptr_depth: 1
        - name: flags
          type:
            name: VariableFlags
        name: GlobalVariable
        other_initializers:
        - class_field: Variable
          init_value: decl, flags
        raw_declaration: explicit GlobalVariable(Decl *decl, VariableFlags flags)
        return_type:
