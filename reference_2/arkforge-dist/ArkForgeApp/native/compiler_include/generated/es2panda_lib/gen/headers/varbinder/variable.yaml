          type:
            name: ImportBindingInfo
            ptr_depth: 1
        name: SetImportBinding
        postfix: noexcept
        raw_declaration: void SetImportBinding(ImportBindingInfo *importBinding) noexcept
        return_type:
          name: void
      - additional_attributes: get
        args: []
        name: IsImportBinding
        postfix: const noexcept
        raw_declaration: '[[nodiscard]] bool IsImportBinding() const noexcept'
        return_type:
          name: bool
          prefix: '[[nodiscard]]'
      - additional_attributes: get
        args: []
        name: IsNamespaceImportBinding
        postfix: const noexcept
        raw_declaration: '[[nodiscard]] bool IsNamespaceImportBinding() const noexcept'
        return_type:
          name: bool
          prefix: '[[nodiscard]]'
      - additional_attributes: get
