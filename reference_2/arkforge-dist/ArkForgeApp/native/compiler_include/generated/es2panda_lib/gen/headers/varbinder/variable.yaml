        name: SetLexical
        postfix: override
        raw_declaration: void SetLexical([[maybe_unused]] Scope *scope) override
        return_type:
          name: void
  class_forward_declaration:
  - Decl
  - Scope
  - VariableScope
  - Variable
  enums:
  - flags:
    - NAMED
    - DEFAULT
    - NAMESPACE
    kind: simple
    name: ImportBindingKind
    namespace: varbinder
  known_macroses:
  - VARIABLE_TYPES(DECLARE_CLASSES)
  macros:
  - arguments: type, className
    body: class className;
    name: DECLARE_CLASSES
  structs:
  - members:
    - default_constructor: ''
      name: importDecl
      type:
        name: ETSImportDeclaration
        namespace: ir
        prefix: const
        ptr_depth: 1
    - default_constructor: ''
      name: importedName
      type:
        name: StringView
        namespace: util
    - default_constructor: ''
      name: localName
      type:
        name: StringView
        namespace: util
    - default_constructor: ''
      name: origin
      type:
        name: AstNode
        namespace: ir
        prefix: const
        ptr_depth: 1
    - default_constructor: ''
      name: resolvedVariable
      type:
        name: Variable
        ptr_depth: 1
    - default_constructor: ''
      name: conflictingLocalVariable
      type:
        name: Variable
        ptr_depth: 1
    - default_constructor: ImportBindingKind::NAMED
      name: kind
      type:
        name: ImportBindingKind
    - default_constructor: ''
      name: isTypeOnly
      type:
        name: bool
    name: ImportBindingInfo
