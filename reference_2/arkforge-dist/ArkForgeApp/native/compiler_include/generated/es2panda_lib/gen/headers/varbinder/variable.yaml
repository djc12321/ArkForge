      methods:
      - additional_attributes: get
        args: []
        name: Type
        postfix: const override
        raw_declaration: VariableType Type() const override
        return_type:
          name: VariableType
      - additional_attributes: set
        args:
        - name: scope
          type:
            name: Scope
            prefix: '[[maybe_unused]]'
            ptr_depth: 1
        name: SetLexical
        postfix: override
        raw_declaration: void SetLexical([[maybe_unused]] Scope *scope) override
